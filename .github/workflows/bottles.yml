name: Publish bottles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Blindspot version already set in the formula (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bottles
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          stable: true
      - name: Check version and formula
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', version), 'Expected a stable version tag'
          formula = Path('Formula/blindspot.rb').read_text()
          assert f'  version "{version[1:]}"' in formula, 'Update the formula before publishing bottles'
          PY
          brew style --formula kitanovicd/tap/blindspot
      - name: Build and verify bottle
        run: |
          brew install --build-bottle kitanovicd/tap/blindspot
          blindspot --version | grep -F "blindspot $VERSION "
          blindspot --help
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/kitanovicd/homebrew-tap/releases/download/$VERSION" \
            kitanovicd/tap/blindspot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          stable: true
          token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          merge-multiple: true
      - name: Merge bottle checksums
        run: |
          brew bottle --merge --write --no-commit --no-all-checks ./*.bottle.json
          brew style --formula kitanovicd/tap/blindspot
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for metadata in Path('.').glob('*.bottle.json'):
              for formula in json.loads(metadata.read_text()).values():
                  for bottle in formula['bottle']['tags'].values():
                      source = Path(bottle['local_filename'])
                      assert hashlib.sha256(source.read_bytes()).hexdigest() == bottle['sha256']
                      source.rename(bottle['filename'])
          PY
      - name: Publish packages and update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" ./*.bottle.tar.gz \
            --target "$GITHUB_SHA" --title "Blindspot $VERSION Homebrew bottles" \
            --notes "Prebuilt Homebrew packages for macOS Apple Silicon, macOS Intel, and Linux x86-64."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/blindspot.rb
          git commit -m "Publish Blindspot $VERSION bottles"
          git push origin HEAD:main
